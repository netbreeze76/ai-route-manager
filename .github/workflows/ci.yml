name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --requirement engine/requirements.txt
      - run: pnpm check
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: python -m unittest discover -s engine -p "test_*.py" -v

  macos-script-gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/build-engine-macos.sh scripts/build-macos.sh scripts/verify-macos-bundle.sh
